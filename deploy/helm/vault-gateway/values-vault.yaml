# HashiCorp Vault passthrough overlay for vault-gateway.
# Usage: helm install vault-gateway ./vault-gateway -f values-vault.yaml
backend: "vault"

config:
  backend:
    type: "vault"
  vault:
    address: "https://vault.vault-system:8200"
    # secretPrefix scopes all secret lookups to an environment prefix,
    # e.g. "prod/" so that "shared/postgres" resolves to "prod/shared/postgres".
    secretPrefix: ""
